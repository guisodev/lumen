# Compila Lumen en Windows, macOS (Apple Silicon) y Linux, lo prueba y guarda los archivos.
# Se ejecuta a mano (Actions → Build → Run workflow), al subir una etiqueta vX.Y.Z
# y en cada cambio de las ramas de trabajo.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["multiplataforma", "ci/**"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Lumen-Windows
            files: |
              dist/Lumen-Setup.exe
              dist/Lumen.zip
          - os: macos-14
            artifact: Lumen-macOS
            files: dist/Lumen-macOS.zip
          - os: ubuntu-22.04
            artifact: Lumen-Linux
            files: dist/Lumen-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Dependencias de Linux (bandeja y diálogos)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-1 zenity

      - name: Paquetes de Python
        shell: bash
        run: |
          python -m pip install -U pip
          python -m pip install -U "yt-dlp[curl-cffi]" yt-dlp-ejs mutagen pystray pillow pyinstaller
          if [ "$RUNNER_OS" != "Linux" ]; then python -m pip install -U pywebview; fi

      - name: ffmpeg y deno
        run: python tools/fetch_vendor.py

      - name: Licencias
        run: python tools/collect_licenses.py

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Compilar
        run: python tools/build.py

      - name: Prueba
        run: python tools/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
